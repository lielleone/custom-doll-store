{% extends "base.html" %}
{% set noindex = true %}

{% block title %}כניסה לניהול{% endblock %}

{% block content %}

  <section class="max-w-md mx-auto px-4 py-16">
    <div class="sticker bg-sky-200 p-8">
      <h1 class="text-3xl mb-6 text-center">
        כניסה לניהול
      </h1>

      {% if error %}
      <p role="alert" class="sticker bg-red-100 p-4 mb-4">
        {{ error }}
      </p>
      {% endif %}

      <form method="post" class="grid gap-4">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <div>
          <label for="password" class="block mb-2">
            סיסמה
          </label>
          <input type="password" id="password" name="password" autocomplete="current-password" required class="field">
        </div>
        <button type="submit" class="btn">
          כניסה
        </button>
      </form>
    </div>
  </section>

{% endblock %}
